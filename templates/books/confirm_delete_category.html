{% extends 'accounts/admin_base.html' %}

{% block title %}Delete Category{% endblock %}

{% block content %}

<div class="catd-wrapper">

    <div class="catd-card">

        <h2 class="catd-title">Delete Category</h2>

        <p class="catd-text">
            Are you sure you want to delete
            <strong>"{{ category.category_name }}"</strong>?
        </p>

        <form method="POST" class="catd-form">
            {% csrf_token %}

            <div class="catd-actions">

                <button type="submit" class="catd-btn-delete">
                    Yes, Delete
                </button>

                <a href="{% url 'category_list' %}" class="catd-btn-cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
