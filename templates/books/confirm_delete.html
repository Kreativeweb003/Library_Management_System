{% extends 'accounts/admin_base.html' %}

{% block title %}Delete Book{% endblock %}

{% block content %}

<div class="adbd-wrapper">

    <div class="adbd-card">

        <h2 class="adbd-title">Delete Book</h2>

        <p class="adbd-text">
            Are you sure you want to delete
            <strong>"{{ book.title }}"</strong>?
        </p>

        <form method="POST" class="adbd-form">
            {% csrf_token %}

            <div class="adbd-actions">

                <button type="submit" class="adbd-btn-delete">
                    Yes, Delete
                </button>

                <a href="{% url 'book_list' %}" class="adbd-btn-cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
